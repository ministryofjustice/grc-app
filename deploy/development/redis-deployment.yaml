apiVersion: apps/v1
kind: Deployment
metadata:
  name: grc-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grc-redis
  template:
    metadata:
      labels:
        app: grc-redis
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      containers:
      - name: grc-redis
        image: docker.io/bitnamisecure/redis@sha256:1347d526ecec0c6537e99eac09e7c3405c21664f6044ff60e78b0898da37abd2
        env:
          - name: ALLOW_EMPTY_PASSWORD
            value: "yes"
        imagePullPolicy: Always
        ports:
        - containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false