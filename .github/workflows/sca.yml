# New SCA scanning to replace existing tool
name: sca.yml
on:
   schedule:
    - cron: '15 2 * * *' # every day at 02:15 UTC
   push:
     branches:
       - master
   pull_request:
   workflow_dispatch:
permissions: {}
jobs:
  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Run SCA
        uses: ministryofjustice/devsecops-actions/sca@8c77d3a65a46d1d4b5416eafae5b84371ecd797d # v1.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate: false
