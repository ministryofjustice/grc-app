# New SCA scanning to replace existing tool
name: sca.yml
on:
   schedule:
    - cron: '15 2 * * *' # every day at 02:15 UTC
   push:
     branches:
       - master
   pull_request:
   workflow_dispatch:
permissions: {}
jobs:
  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      security-events: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Run SCA
        uses: ministryofjustice/devsecops-actions/sca@7dc13c20e2bf541b8a77fa1320a04983b18846f6 # v1.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate: true
          disable-node-audit: "true"
      - name: NPM audit
        run: npm audit --audit-level=high