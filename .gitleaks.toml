title = "GRC gitleaks config"
[extend]
useDefault = true

[[allowlists]]
description = "Temporary false-positive: GOV.UK Notify template ID constant"
paths = ['''^grc/external_services/gov_uk_notify_templates\.py$''']
regexes = ['''^\s*ADMIN_FORGET_PASSWORD_TEMPLATE\s*=\s*['"][^'"]+['"]\s*$''']

[[allowlists]]
description = "Temporary false-positive: test fixture password value"
paths = ['''^tests/grc/unit/utils/test_custom_form_validators/test_validate_password_strength\.py$''']
regexes = ['''^\s*form\.password\.data\s*=\s*['"][^'"]+['"]\s*$''']
