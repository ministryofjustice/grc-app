version: "3.8"

services:

  redis:
    image: redis:latest@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    container_name: redis

  grc_clamav:
    image: 'clamav/clamav:latest@sha256:45fe5149fbee5a46509c9848ef20d0c354b7b2323c9369f285939a37cf33422a'

  grc_db:
    image: "postgres:14.22@sha256:eba8ddbdd837ecfbb6ca8a26d8deec68a2f9b076660102ae641dba0f371c099b"
    container_name: "grc_db"
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=grc
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=grc_db

  grc_jwks:
    container_name: "grc_jwks"
    build:
      context: .
      dockerfile: jwks.Dockerfile
    ports:
      - 3003:3003
    env_file: .jwks.env
    command: /app/run_jwks.sh

  grc_app:
    container_name: "grc_app"
    build:
      context: .
    ports:
      - 3000:3000
    env_file: .env
    volumes:
      - ./:/app
    entrypoint: dockerize -wait tcp://grc_db:5432
    depends_on:
      - grc_db
    command: /app/run.sh

  grc_admin:
    container_name: "grc_admin"
    build:
      context: .
      dockerfile: admin.Dockerfile
    ports:
      - 3001:3001
    env_file: .admin.env
    volumes:
      - ./:/admin
    entrypoint: dockerize -wait tcp://grc_db:5432
    depends_on:
      - grc_db
    command: /app/run_admin.sh

  grc_dashboard:
    container_name: "grc_dashboard"
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - 3002:3002
    env_file: .dashboard.env
    volumes:
      - ./:/dashboard
    entrypoint: dockerize -wait tcp://grc_db:5432
    depends_on:
      - grc_db
    command: /app/run_dashboard.sh

volumes:
  dbdata:

